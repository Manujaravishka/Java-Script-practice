<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    

    <script>
        var a ="10";

        console.log(a+2); //102 (string concatenation)
        console.log(+a+2); //12 (unary plus converts string to number)

        var b ="4";
        console.log(+b);
        console.log(-b); //4 (unary plus converts string to number)

        var c = 5;
        console.log(-c); //-5 (unary minus negates the number)

    </script>
</body>
</html>
